<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM Building Height Enrichment</title>
    <link href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }

        .layout { display: flex; height: 100vh; }
        #map { flex: 1; }

        .sidebar {
            width: 380px;
            background: #fff;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }
        .sidebar-header h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .sidebar-header p { font-size: 12px; color: #666; }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .section { margin-bottom: 20px; }
        .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 8px; }

        .bbox-display {
            font-family: monospace;
            font-size: 12px;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            color: #333;
            min-height: 36px;
            display: flex;
            align-items: center;
        }
        .bbox-display.empty { color: #aaa; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            transition: all 0.15s;
        }
        .btn-primary { background: #c00; color: #fff; }
        .btn-primary:hover { background: #a00; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-secondary:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn-group .btn { flex: 1; }

        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #c00;
            border-radius: 2px;
            transition: width 0.3s;
            width: 0%;
        }

        .log-area {
            font-family: monospace;
            font-size: 11px;
            background: #1a1a1a;
            color: #ccc;
            padding: 12px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .log-area .log-step { color: #4CAF50; font-weight: 600; }
        .log-area .log-error { color: #f44336; }
        .log-area .log-info { color: #aaa; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .stat-card {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 700; color: #333; }
        .stat-label { font-size: 11px; color: #888; margin-top: 2px; }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-idle { background: #f0f0f0; color: #888; }
        .status-running { background: #fff3e0; color: #e65100; }
        .status-done { background: #e8f5e9; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }

        .draw-hint {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .draw-hint.hidden { opacity: 0; }

        .legend {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
    </style>
</head>
<body>
<div class="layout">
    <div id="map">
        <div class="draw-hint" id="draw-hint">Click and drag on the map to select an area</div>
    </div>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>OSM Building Height Enrichment</h1>
            <p>Add building heights to OpenStreetMap using swisstopo elevation data</p>
        </div>
        <div class="sidebar-content">

            <div class="section">
                <div class="section-title">Selected Area</div>
                <div class="bbox-display empty" id="bbox-display">Draw a rectangle on the map</div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="btn-clear" disabled>Clear</button>
                    <button class="btn btn-primary" id="btn-run" disabled>Run Pipeline</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">
                    Status <span class="status-badge status-idle" id="status-badge">Idle</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="log-area" id="log-area"></div>
            </div>

            <div class="section" id="results-section" style="display:none;">
                <div class="section-title">Results</div>
                <div class="stats" id="stats"></div>
                <div class="btn-group" style="margin-top: 12px;">
                    <button class="btn btn-secondary" id="btn-show-map" disabled>Show on Map</button>
                    <button class="btn btn-secondary" id="btn-download" disabled>Download GeoJSON</button>
                </div>
                <div class="legend" id="legend" style="display:none; margin-top: 12px;">
                    <div class="legend-item"><div class="legend-dot" style="background:#4CAF50;"></div> Enriched (new height)</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#2196F3;"></div> Already had height</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#9E9E9E;"></div> Skipped</div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
// ---- Map setup ----
const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [7.45, 46.95],
    zoom: 14,
    pitch: 0,
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');

// ---- Rectangle drawing ----
let drawing = false;
let startLngLat = null;
let bbox = null;
let rectSource = null;

map.on('load', function() {
    map.addSource('draw-rect', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'draw-rect-fill', type: 'fill', source: 'draw-rect', paint: { 'fill-color': '#c00', 'fill-opacity': 0.1 } });
    map.addLayer({ id: 'draw-rect-line', type: 'line', source: 'draw-rect', paint: { 'line-color': '#c00', 'line-width': 2 } });

    // Result layers (added later)
    map.addSource('result-buildings', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
        id: 'result-fill', type: 'fill-extrusion', source: 'result-buildings',
        paint: {
            'fill-extrusion-color': ['case',
                ['has', 'source:height'], '#4CAF50',
                ['has', 'height'], '#2196F3',
                '#9E9E9E'
            ],
            'fill-extrusion-height': ['case',
                ['has', 'height'], ['to-number', ['get', 'height'], 5],
                5
            ],
            'fill-extrusion-base': 0,
            'fill-extrusion-opacity': 0.8,
        },
        layout: { visibility: 'none' },
    });
});

const canvas = map.getCanvasContainer();

map.on('mousedown', function(e) {
    if (e.originalEvent.shiftKey || pipelineRunning) return;
    drawing = true;
    startLngLat = e.lngLat;
    canvas.style.cursor = 'crosshair';
    map.dragPan.disable();
});

map.on('mousemove', function(e) {
    if (!drawing || !startLngLat) return;
    updateRect(startLngLat, e.lngLat);
});

map.on('mouseup', function(e) {
    if (!drawing) return;
    drawing = false;
    canvas.style.cursor = '';
    map.dragPan.enable();

    if (startLngLat) {
        updateRect(startLngLat, e.lngLat);
        const sw = startLngLat;
        const ne = e.lngLat;
        bbox = [
            Math.min(sw.lng, ne.lng).toFixed(5),
            Math.min(sw.lat, ne.lat).toFixed(5),
            Math.max(sw.lng, ne.lng).toFixed(5),
            Math.max(sw.lat, ne.lat).toFixed(5),
        ].join(',');

        document.getElementById('bbox-display').textContent = bbox;
        document.getElementById('bbox-display').classList.remove('empty');
        document.getElementById('btn-run').disabled = false;
        document.getElementById('btn-clear').disabled = false;
        document.getElementById('draw-hint').classList.add('hidden');
    }
});

function updateRect(sw, ne) {
    const coords = [[
        [Math.min(sw.lng, ne.lng), Math.min(sw.lat, ne.lat)],
        [Math.max(sw.lng, ne.lng), Math.min(sw.lat, ne.lat)],
        [Math.max(sw.lng, ne.lng), Math.max(sw.lat, ne.lat)],
        [Math.min(sw.lng, ne.lng), Math.max(sw.lat, ne.lat)],
        [Math.min(sw.lng, ne.lng), Math.min(sw.lat, ne.lat)],
    ]];
    map.getSource('draw-rect').setData({
        type: 'Feature',
        geometry: { type: 'Polygon', coordinates: coords },
    });
}

// ---- Pipeline controls ----
let pipelineRunning = false;

document.getElementById('btn-clear').onclick = function() {
    bbox = null;
    map.getSource('draw-rect').setData({ type: 'FeatureCollection', features: [] });
    map.getSource('result-buildings').setData({ type: 'FeatureCollection', features: [] });
    map.setLayoutProperty('result-fill', 'visibility', 'none');
    document.getElementById('bbox-display').textContent = 'Draw a rectangle on the map';
    document.getElementById('bbox-display').classList.add('empty');
    document.getElementById('btn-run').disabled = true;
    document.getElementById('btn-clear').disabled = true;
    document.getElementById('draw-hint').classList.remove('hidden');
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
};

document.getElementById('btn-run').onclick = function() {
    if (!bbox || pipelineRunning) return;
    startPipeline(bbox);
};

document.getElementById('btn-show-map').onclick = function() {
    fetch('/result').then(r => r.json()).then(data => {
        map.getSource('result-buildings').setData(data);
        map.setLayoutProperty('result-fill', 'visibility', 'visible');
        map.easeTo({ pitch: 60, bearing: -20, duration: 800 });
        document.getElementById('legend').style.display = 'block';
    });
};

document.getElementById('btn-download').onclick = function() {
    window.location.href = '/download';
};

// ---- Pipeline execution ----
function startPipeline(bboxStr) {
    pipelineRunning = true;
    document.getElementById('btn-run').disabled = true;
    document.getElementById('btn-clear').disabled = true;
    document.getElementById('results-section').style.display = 'none';

    setStatus('running', 'Running');
    clearLog();
    setProgress(0);

    fetch('/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bbox: bboxStr }),
    }).then(r => {
        if (!r.ok) return r.json().then(d => { throw new Error(d.error); });
        listenProgress();
    }).catch(err => {
        addLog('error', 'Failed to start: ' + err.message);
        setStatus('error', 'Error');
        pipelineRunning = false;
        document.getElementById('btn-clear').disabled = false;
    });
}

function listenProgress() {
    const source = new EventSource('/progress');
    source.onmessage = function(e) {
        const msg = JSON.parse(e.data);

        switch (msg.type) {
            case 'step':
                addLog('step', msg.message);
                if (msg.step && msg.total_steps) {
                    setProgress((msg.step - 1) / msg.total_steps * 100);
                }
                break;
            case 'progress':
                if (msg.current && msg.total) {
                    setProgress((msg.current / msg.total) * 100);
                }
                break;
            case 'log':
                addLog('info', msg.message);
                break;
            case 'done':
                addLog('step', msg.message);
                setProgress(100);
                setStatus('done', 'Complete');
                showResults(msg);
                pipelineRunning = false;
                document.getElementById('btn-clear').disabled = false;
                source.close();
                break;
            case 'error':
                addLog('error', msg.message);
                setStatus('error', 'Error');
                pipelineRunning = false;
                document.getElementById('btn-clear').disabled = false;
                source.close();
                break;
        }
    };
    source.onerror = function() {
        source.close();
        if (pipelineRunning) {
            addLog('error', 'Connection lost');
            setStatus('error', 'Error');
            pipelineRunning = false;
            document.getElementById('btn-clear').disabled = false;
        }
    };
}

// ---- UI helpers ----
function setStatus(cls, text) {
    const el = document.getElementById('status-badge');
    el.className = 'status-badge status-' + cls;
    el.textContent = text;
}

function setProgress(pct) {
    document.getElementById('progress-fill').style.width = Math.min(100, pct) + '%';
}

function clearLog() {
    document.getElementById('log-area').innerHTML = '';
}

function addLog(type, text) {
    const el = document.getElementById('log-area');
    const line = document.createElement('div');
    line.className = 'log-' + type;
    line.textContent = text;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
}

function showResults(msg) {
    const section = document.getElementById('results-section');
    section.style.display = 'block';

    const stats = document.getElementById('stats');
    stats.innerHTML =
        '<div class="stat-card"><div class="stat-value">' + (msg.total || 0) + '</div><div class="stat-label">Total Buildings</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + (msg.enriched || 0) + '</div><div class="stat-label">Enriched</div></div>';

    document.getElementById('btn-show-map').disabled = false;
    document.getElementById('btn-download').disabled = false;
}
</script>
</body>
</html>
