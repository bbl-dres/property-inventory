<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIS Server</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <link href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="pb-body">
  <a href="#app" class="pb-skip-link">Skip to main content</a>
  <header class="pb-topbar">
    <a href="#/products" class="pb-topbar-title" aria-label="Home">
      <span class="material-symbols-outlined">database</span>
      <span>GIS Server</span>
    </a>
    <div class="pb-topbar-right">
      <div class="pb-topbar-hint" title="Mock backend using browser localStorage">
        <span class="material-symbols-outlined">cloud_off</span>
        <span>mock &middot; localStorage</span>
      </div>
      <a href="#/settings" class="pb-topbar-gear" id="pb-settings-btn"
         title="Settings" aria-label="Settings">
        <span class="material-symbols-outlined">settings</span>
      </a>
      <div class="pb-menu-wrap" id="pb-account-wrap">
        <button type="button" class="pb-topbar-avatar" id="pb-account-btn"
                aria-haspopup="menu" aria-expanded="false" aria-label="Account">
          <span aria-hidden="true">DR</span>
        </button>
        <div class="pb-menu" role="menu" hidden id="pb-account-menu">
          <div class="pb-menu-header">
            <div class="pb-menu-header-name">David Rasner</div>
            <div class="pb-menu-header-sub">davidrasner5@gmail.com</div>
          </div>
          <button type="button" class="pb-menu-item" role="menuitem" data-account-action="profile">
            <span class="material-symbols-outlined">person</span>
            <span>Profile</span>
          </button>
          <button type="button" class="pb-menu-item" role="menuitem" data-account-action="preferences">
            <span class="material-symbols-outlined">tune</span>
            <span>Preferences</span>
          </button>
          <div class="pb-menu-sep"></div>
          <button type="button" class="pb-menu-item" role="menuitem" data-account-action="signout">
            <span class="material-symbols-outlined">logout</span>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <nav class="pb-section-nav" aria-label="Primary">
    <div class="pb-section-nav-inner" id="pb-tabs"></div>
  </nav>

  <div class="pb-layout-grid" id="pb-layout-grid">
    <aside class="pb-object-sidebar" id="pb-object-sidebar"></aside>

    <main id="app" class="pb-main" tabindex="-1"></main>
  </div>

  <div id="toast-host" class="pb-toast-host" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-host" class="pb-modal-host"></div>
  <div id="aria-live" class="pb-sr-only" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
